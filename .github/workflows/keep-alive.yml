name: Keep Server Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from sleeping (Render sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Server Health Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://school-backend-30rz.onrender.com/api/health")
          echo "Server responded with HTTP status: $response"
